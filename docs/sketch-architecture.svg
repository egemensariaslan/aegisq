<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420">
  <title>AegisQ architecture</title>
  <desc>A classical tensor flows through an encoding into a noise-resilient ansatz, simulated under a hardware noise model, then through a mitigation wrapper (zero-noise extrapolation or symmetry verification) before a classical read-out head. The same layer, run at several noise levels, feeds the benchmark harness and the interactive dashboard.</desc>
  <style>
    .bg    { fill: #FDFCFA }
    .ink   { fill: #16161A; stroke: #16161A }
    .muted { fill: #454B59; stroke: #454B59 }
    .faint { fill: #646A78; stroke: #646A78 }
    .box   { fill: #FDFCFA; stroke: #16161A; stroke-width: 1.8; rx: 8 }
    .box-accent { fill: #FDFCFA; stroke: #3f80c4; stroke-width: 2; rx: 8 }
    .box-mit    { fill: #FDFCFA; stroke: #3f9963; stroke-width: 2; rx: 8 }
    .arrow { stroke: #16161A; stroke-width: 1.8; fill: none; marker-end: url(#head) }
    .arrow-dash { stroke: #6E7481; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; marker-end: url(#head-faint) }
    .label { font-family: Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, monospace; }
    .h-blue  { fill: #3f80c4 }
    .h-green { fill: #3f9963 }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0E1117 }
      .ink   { fill: #F2F4F8; stroke: #F2F4F8 }
      .muted { fill: #C2C8D4; stroke: #C2C8D4 }
      .faint { fill: #8A93A6; stroke: #8A93A6 }
      .box   { fill: #0E1117; stroke: #F2F4F8 }
      .box-accent { fill: #0E1117; stroke: #6ea8fe }
      .box-mit    { fill: #0E1117; stroke: #6ed69a }
      .arrow { stroke: #F2F4F8 }
      .arrow-dash { stroke: #9AA2B4 }
      .h-blue  { fill: #6ea8fe }
      .h-green { fill: #6ed69a }
    }
  </style>

  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink"/>
    </marker>
    <marker id="head-faint" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="faint"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="420"/>

  <!-- input -->
  <rect class="box" x="20" y="150" width="120" height="56"/>
  <text x="80" y="183" class="ink label" font-size="14" text-anchor="middle">classical x</text>

  <line class="arrow" x1="140" y1="178" x2="182" y2="178"/>

  <!-- QuantumLayer -->
  <rect class="box-accent" x="184" y="60" width="270" height="236"/>
  <text x="319" y="86" class="h-blue ink label" font-size="13" font-weight="700" text-anchor="middle">QuantumLayer</text>

  <rect class="box" x="204" y="104" width="230" height="48"/>
  <text x="319" y="133" class="ink label" font-size="13" text-anchor="middle">Encoding (angle / excitation / ...)</text>

  <rect class="box" x="204" y="164" width="230" height="48"/>
  <text x="319" y="193" class="ink label" font-size="13" text-anchor="middle">Resilient ansatz (local / equivariant)</text>

  <rect class="box" x="204" y="224" width="230" height="52"/>
  <text x="319" y="247" class="ink label" font-size="13" text-anchor="middle">NoiseSpec &#8594; device</text>
  <text x="319" y="264" class="faint mono" font-size="10.5" text-anchor="middle">default.mixed, depolarizing / dephasing / T1,T2</text>

  <line class="arrow" x1="454" y1="178" x2="496" y2="178"/>

  <!-- Mitigation -->
  <rect class="box-mit" x="498" y="80" width="240" height="196"/>
  <text x="618" y="106" class="h-green ink label" font-size="13" font-weight="700" text-anchor="middle">Mitigation (optional)</text>

  <rect class="box" x="516" y="126" width="204" height="52"/>
  <text x="618" y="149" class="ink label" font-size="13" text-anchor="middle">ZNE</text>
  <text x="618" y="166" class="faint mono" font-size="10" text-anchor="middle">fold noise, extrapolate to &#955;=0</text>

  <rect class="box" x="516" y="196" width="204" height="52"/>
  <text x="618" y="219" class="ink label" font-size="13" text-anchor="middle">SymmetryVerification</text>
  <text x="618" y="236" class="faint mono" font-size="10" text-anchor="middle">post-select the conserved sector</text>

  <line class="arrow" x1="738" y1="178" x2="780" y2="178"/>

  <!-- classical head -->
  <rect class="box" x="782" y="150" width="150" height="56"/>
  <text x="857" y="174" class="ink label" font-size="13" text-anchor="middle">classical head</text>
  <text x="857" y="192" class="faint mono" font-size="10" text-anchor="middle">nn.Linear, ...</text>

  <line class="arrow" x1="932" y1="178" x2="974" y2="178"/>

  <rect class="box" x="976" y="150" width="184" height="56"/>
  <text x="1068" y="183" class="ink label" font-size="14" text-anchor="middle">prediction</text>

  <!-- benchmark + dashboard, fed by running the same layer at several noise levels -->
  <line class="arrow-dash" x1="319" y1="296" x2="319" y2="340"/>
  <line class="arrow-dash" x1="618" y1="296" x2="618" y2="340"/>

  <rect class="box" x="184" y="342" width="270" height="60"/>
  <text x="319" y="368" class="ink label" font-size="13" text-anchor="middle">Benchmark harness</text>
  <text x="319" y="386" class="faint mono" font-size="10.5" text-anchor="middle">matched data / seeds vs. baseline templates</text>

  <rect class="box" x="498" y="342" width="240" height="60"/>
  <text x="618" y="368" class="ink label" font-size="13" text-anchor="middle">Dashboard (aegisq serve)</text>
  <text x="618" y="386" class="faint mono" font-size="10.5" text-anchor="middle">same measurements, drawn live</text>
</svg>
