[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisq"
version = "0.1.0"
description = "Noise-resilient quantum neural network layers and error-mitigated execution wrappers for PyTorch + PennyLane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AegisQ contributors" }]
keywords = [
    "quantum-machine-learning",
    "pennylane",
    "pytorch",
    "error-mitigation",
    "zero-noise-extrapolation",
    "nisq",
    "barren-plateau",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pennylane>=0.40",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist"]
plot = ["matplotlib>=3.7"]

[project.scripts]
aegisq = "aegisq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisq"]

[tool.pytest.ini_options]
# Docstring examples run with the suite, so the documented API cannot drift.
testpaths = ["tests", "src/aegisq"]
addopts = "--doctest-modules"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
